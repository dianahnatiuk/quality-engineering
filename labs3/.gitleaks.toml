title = "Lab 3 - secret scanning rules"

[extend]
# стандартний набір правил Gitleaks + власне правило проєкту
useDefault = true

[[rules]]
id = "lab3-pricing-api-key"
description = "Hardcoded Pricing Service API key"
regex = '''(?i)pricing[_-]?api[_-]?key["']?\s*[:=]\s*["']?([A-Za-z0-9_\-]{20,})'''
secretGroup = 1
keywords = ["pricing"]

[allowlist]
description = "Файли, що за дизайном не містять реальних значень"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)docs/''',
  '''(^|/)\.gitleaks\.toml$''',
]
